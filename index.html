<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Inscripciones ISIMA 2026</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <header>

        <h1>UNIVERSIDAD ISIMA</h1>

        <h2>Inscripciones Ciclo 2026</h2>

    </header>



    <section class="principal">


        <div class="numero">

            <span id="total">
                0
            </span>

            <p>
                inscritos
            </p>

        </div>



        <div class="meta">

            <p>
                Meta:
                <strong id="meta">
                    0
                </strong>
            </p>


            <div class="barra">

                <div 
                id="progreso">
                </div>

            </div>


            <h3 id="porcentaje">
                0%
            </h3>


        </div>


    </section>




    <section>


        <h2 class="titulo">
            Programas Académicos
        </h2>


        <div 
        class="grid" 
        id="programas">

        </div>


    </section>



</div>



<script src="script.js"></script>


</body>

</html>
