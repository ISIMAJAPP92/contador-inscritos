<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard ISIMA | Inscripciones 2026</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<header>

<h1>UNIVERSIDAD ISIMA</h1>

<p>INSCRIPCIONES CICLO 2026</p>

</header>


<section class="principal">

<div class="numero" id="total">
0
</div>

<div class="meta">
Meta: <span id="meta">0</span> alumnos
</div>


<div class="barra">
<div id="progreso"></div>
</div>


<h2 id="porcentaje">
0%
</h2>

</section>



<section class="grid">


<div class="card">
<span>📚</span>
<h3>Bachillerato</h3>
<strong id="bachillerato">0</strong>
</div>


<div class="card">
<span>🎓</span>
<h3>Licenciaturas</h3>
<strong id="licenciaturas">0</strong>
</div>


<div class="card">
<span>⚙️</span>
<h3>Ingeniería</h3>
<strong id="ingenieria">0</strong>
</div>


<div class="card">
<span>🏛</span>
<h3>Especialidad</h3>
<strong id="especialidad">0</strong>
</div>


<div class="card">
<span>🎓</span>
<h3>Maestrías</h3>
<strong id="maestrias">0</strong>
</div>


<div class="card">
<span>👨‍🏫</span>
<h3>Doctorado</h3>
<strong id="doctorado">0</strong>
</div>


</section>



<section class="crecimiento">

<h2>Crecimiento</h2>

<div>
Hoy
<b id="hoy">+0</b>
</div>

<div>
Semana
<b id="semana">+0</b>
</div>

<div>
Mes
<b id="mes">+0</b>
</div>

</section>



<footer>

Actualizado:
<span id="actualizado"></span>

</footer>


</div>


<script src="script.js"></script>

</body>
</html>
